name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Check extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - name: Cache Cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Install pinned Shuck
        env:
          SHUCK_VERSION: "0.2.2"
          SHUCK_ASSET: shuck-cli-x86_64-unknown-linux-gnu.tar.xz
          SHUCK_SHA256: 07c6ccd16424956c9782658639bf647010e765a6bc0359a96246c0f6dc049147
        run: |
          set -euo pipefail
          install_root="$RUNNER_TEMP/shuck"
          archive="$RUNNER_TEMP/$SHUCK_ASSET"
          mkdir -p "$install_root"
          curl --fail --silent --show-error --location \
            "https://github.com/ewhauser/shuck/releases/download/v${SHUCK_VERSION}/${SHUCK_ASSET}" \
            --output "$archive"
          printf '%s  %s\n' "$SHUCK_SHA256" "$archive" | sha256sum --check -
          tar --extract --xz --file "$archive" --directory "$install_root"
          shuck_dir="$install_root/shuck-cli-x86_64-unknown-linux-gnu"
          echo "$shuck_dir" >> "$GITHUB_PATH"
          echo "SHUCK_BINARY=$shuck_dir/shuck" >> "$GITHUB_ENV"
          "$shuck_dir/shuck" --version
      - name: Run LSP smoke test
        run: node scripts/lsp-smoke.js
      - name: Validate extension manifest
        run: |
          python3 - <<'PY'
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("extension.toml").read_text())
          required = {"id", "name", "version", "schema_version", "description", "repository"}
          missing = required.difference(data)
          assert not missing, f"missing manifest keys: {sorted(missing)}"
          assert data["language_servers"]["shuck"]["languages"] == ["Shell Script"]
          print("manifest valid")
          PY
      - run: cargo fmt --check
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build --release --target wasm32-wasip2
